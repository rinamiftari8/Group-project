
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fitness Services</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f8f8;
      margin: 0;
      padding: 40px;
    }

    .services {
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 320px;
      text-align: center;
      padding-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card h3 {
      margin: 20px 0 10px;
      font-size: 20px;
    }

    .card p {
      font-size: 14px;
      color: #777;
      padding: 0 20px;
      line-height: 1.5;
      font-family: Georgia, 'Times New Roman', Times, serif
    }

    .card button {
      margin-top: 15px;
      padding: 10px 25px;
      background: #000;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 1px;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    }

    .card button:hover {
      background: #333;
    }
  </style>
</head>

<body>
 

  <section class="services">

    <div class="card">
      <img src="nutrition coaching.jpg" alt="Nutrition Coaching">
      <h3>Nutrition Coaching</h3>
      <p>
        Nutrition is essential for maintaining health and energy.
      </p>
      <button>LEARN MORE</button>
    </div>

    <div class="card">
      <img src="fitness coach.jpg" alt="Fitness Training">
      <h3>Fitness Training</h3>
      <p>
        Fitness helps improve strength,energy and overall health through regular exercise.
      </p>
      <button>LEARN MORE</button>
    </div>

    <div class="card">
      <img src="yoga.jpg" alt="Virtual Classes">
      <h3>Yoga</h3>
      <p>
        Yoga improves flexibility,reduces stress and promotes well-being.
      </p>
      <button>LEARN MORE</button>
    </div>

  </section>

</body>
</html>
